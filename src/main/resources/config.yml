# Configurazione principale di GravityStaffMode.

# Se attivo, i messaggi di entrata e uscita dei giocatori in vanish non vengono mostrati.
nascondi-messaggi-accesso-uscita: true

# Prefissi visualizzati nella tab. Puoi usare colori (&) e il segnaposto {prefisso}.
# {prefisso} mantiene il nome/prefisso tab impostato da altri plugin, ad esempio quello dei rank.
tab:
  prefisso-staffmode: '&b[S] &r{prefisso}'
  prefisso-vanish: '&7[V] &r{prefisso}'

# Gli stati dei giocatori (vanish e staff mode) sono salvati in dati.yml.

# Gamemode usata in staff mode (SURVIVAL, ADVENTURE, CREATIVE, SPECTATOR).
# CREATIVE e sconsigliata: con l'invsee permette di creare o duplicare oggetti.
gamemode-staffmode: SURVIVAL

freeze:
  # Comando eseguito dalla console se un giocatore freezato esce dal server.
  # Usa {giocatore} per il nome. Lascia vuoto per non eseguire nulla.
  # Esempio: 'ban {giocatore} Uscito durante il freeze'
  comando-uscita: ''

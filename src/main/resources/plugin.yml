name: GravityStaffMode
version: 1.1.1
main: it.gravitymc.gravitystaffmode.GravityStaffModePlugin
api-version: '1.13'
author: GravityMC
description: Staff mode configurabile in italiano, compatibile con Minecraft 1.8 fino alla 1.21.11.
commands:
  vanish:
    description: Toggles your vanish status.
    usage: /vanish
    aliases: [v]
    permission: gravityvanish.use
  staffmode:
    description: Attiva o disattiva la modalita staff.
    usage: /staffmode
    aliases: [sm]
    permission: gravityvanish.staffmode
  invsee:
    description: Apre l'inventario di un giocatore.
    usage: /invsee <giocatore>
    aliases: [inv]
    permission: gravityvanish.invsee
  randomtp:
    description: Ti teletrasporta da un giocatore casuale.
    usage: /randomtp
    aliases: [rtp]
    permission: gravityvanish.randomtp
  fly:
    description: Attiva o disattiva il volo in staff mode.
    usage: /fly
    permission: gravityvanish.fly
  gravitystaffmode:
    description: Gestisce la configurazione di GravityStaffMode.
    usage: /gravitystaffmode reload
    aliases: [gsm]
    permission: gravitystaffmode.reload
permissions:
  # Nomi consigliati: gravitystaffmode.<nome>. Ognuno concede il vecchio permesso gravityvanish.*
  # corrispondente, che resta valido, quindi i server gia configurati non devono cambiare niente.
  gravitystaffmode.*:
    description: Tutti i permessi di GravityStaffMode.
    default: op
    children:
      gravitystaffmode.vanish: true
      gravitystaffmode.see: true
      gravitystaffmode.staffmode: true
      gravitystaffmode.invsee: true
      gravitystaffmode.randomtp: true
      gravitystaffmode.fly: true
      gravitystaffmode.freeze.bypass: true
      gravitystaffmode.reload: true
  gravitystaffmode.vanish:
    description: Permette di attivare il vanish.
    default: op
    children:
      gravityvanish.use: true
  gravitystaffmode.see:
    description: Permette di vedere i giocatori in vanish.
    default: op
    children:
      gravityvanish.see: true
  gravitystaffmode.staffmode:
    description: Permette di usare e vedere la staff mode.
    default: op
    children:
      gravityvanish.staffmode: true
  gravitystaffmode.invsee:
    description: Permette di aprire gli inventari altrui.
    default: op
    children:
      gravityvanish.invsee: true
  gravitystaffmode.randomtp:
    description: Permette il teletrasporto casuale tra giocatori.
    default: op
    children:
      gravityvanish.randomtp: true
  gravitystaffmode.fly:
    description: Permette di usare il volo.
    default: op
    children:
      gravityvanish.fly: true
  gravitystaffmode.freeze.bypass:
    description: Impedisce di essere freezati dallo staff.
    default: op
    children:
      gravityvanish.freeze.bypass: true
  gravitystaffmode.reload:
    description: Permette di ricaricare GravityStaffMode senza riavviare il server.
    default: op
  gravityvanish.use:
    description: Permette di attivare il vanish. Vecchio nome di gravitystaffmode.vanish.
    default: op
  gravityvanish.see:
    description: Permette di vedere i giocatori in vanish. Vecchio nome di gravitystaffmode.see.
    default: op
  gravityvanish.staffmode:
    description: Permette di usare e vedere la staff mode. Vecchio nome di gravitystaffmode.staffmode.
    default: op
  gravityvanish.invsee:
    description: Permette di aprire gli inventari altrui. Vecchio nome di gravitystaffmode.invsee.
    default: op
  gravityvanish.randomtp:
    description: Permette il teletrasporto casuale tra giocatori. Vecchio nome di gravitystaffmode.randomtp.
    default: op
  gravityvanish.fly:
    description: Permette di usare il volo. Vecchio nome di gravitystaffmode.fly.
    default: op
  gravityvanish.freeze.bypass:
    description: Impedisce di essere freezati dallo staff. Vecchio nome di gravitystaffmode.freeze.bypass.
    default: op
